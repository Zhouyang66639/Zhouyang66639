name: Refresh upstream GitHub Stars

on:
  schedule:
    - cron: '17 * * * *'
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - '.github/workflows/update-stars.yml'
      - 'scripts/update-github-stars.mjs'

permissions:
  contents: read

concurrency:
  group: upstream-stars
  cancel-in-progress: false

jobs:
  refresh:
    if: github.event_name != 'workflow_dispatch' || github.ref == 'refs/heads/main'
    permissions:
      contents: write
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Check out the profile repository
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # actions/checkout v4.2.2
        with:
          ref: main
          persist-credentials: true

      - name: Set up Node.js 22
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # actions/setup-node v4.4.0
        with:
          node-version: 22

      - name: Verify the publisher failure and atomicity contracts
        run: node --test scripts/update-github-stars.test.mjs

      - name: Refresh both public repository counts atomically
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: node scripts/update-github-stars.mjs

      - name: Commit and publish the verified snapshot
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -- data/github-stars.json
          if git diff --cached --quiet; then
            echo "Snapshot is unchanged; no commit is needed."
          else
            git commit -m "chore: refresh upstream GitHub Stars"
          fi
          git push origin HEAD:main
